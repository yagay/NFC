name: One-shot NFC Entry Black Screen Hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-entry-black-screen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove synchronous provider reads from activity entry path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/nfcdoorcard/MainActivity.kt')
          s = p.read_text()
          replacements = [
            ('override fun onResume() { super.onResume(); applyReadDispatchState() }',
             'override fun onResume() { super.onResume(); if (readModeEnabled) enableReadDispatch() }'),
            ('    private fun applyReadDispatchState() {\n        if (readModeEnabled && !getSimulationEnabled()) enableReadDispatch() else disableReadDispatch()\n    }\n\n', ''),
            ('    private fun enableReadDispatch() {\n        if (!readModeEnabled || getSimulationEnabled()) return\n',
             '    private fun enableReadDispatch() {\n        if (!readModeEnabled) return\n'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'target not found: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/nfcdoorcard/MainActivity.kt
          git commit -m 'fix: remove provider reads from NFC activity entry path'
          git push

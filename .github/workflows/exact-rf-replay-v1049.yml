name: Exact RF replay v1.0.49 migration

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/migrate_exact_rf_replay_v1049.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact RF replay migration
        run: python3 scripts/migrate_exact_rf_replay_v1049.py
      - name: Commit product changes and clean migration files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/exact-rf-replay-v1049.yml scripts/migrate_exact_rf_replay_v1049.py
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: replay exact RF invocation after NFC re-enable"
          git push

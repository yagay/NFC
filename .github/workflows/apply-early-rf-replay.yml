name: Apply early RF replay

on: [push]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply implementation
        run: python3 scripts/apply_early_rf_replay.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/nfcdoorcard/xposed/NfcInjectionModule.java app/src/main/java/com/yagay/nfcdoorcard/xposed/NfcProcessVendorController.java app/build.gradle.kts
          git commit -m "feat: add early RF replay lifecycle recovery" || exit 0
          git push

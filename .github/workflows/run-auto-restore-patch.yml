name: One-shot NFC auto restore patch
on:
  push:
    paths:
      - '.github/workflows/run-auto-restore-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch_auto_restore.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/AndroidManifest.xml app/src/main/java/com/example/nfcdoorcard/xposed/NfcInjectionModule.java
          git commit -m 'feat: auto restore simulation after reboot and NFC restart'
          git push

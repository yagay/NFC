name: One-shot app architecture refactor

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-app-architecture-refactor.yml'
      - '.github/scripts/refactor_app_arch.py'
      - '.github/scripts/fix_refactor_output.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply refactor
        run: |
          sed -i "s/, 'private fun decodeRuntimeStatus(map'//" .github/scripts/refactor_app_arch.py
          python3 .github/scripts/refactor_app_arch.py
          python3 .github/scripts/fix_refactor_output.py
      - name: Verify refactor
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleRelease --stacktrace
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'META-INF/xposed/java_init.list'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'META-INF/xposed/java_init.list'
      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-app-architecture-refactor.yml .github/scripts/refactor_app_arch.py .github/scripts/fix_refactor_output.py
          git add app
          git commit -m "Refactor app architecture around runtime services"
          git push origin HEAD:main

name: UID vendor migration

on: [push]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 scripts/migrate_uid_vendor_support.py

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'feat: support 4 7 10 byte UID and broaden NFC vendor discovery'
          git push origin HEAD:main

name: One-shot state finalization

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/state-finalization.yml'
      - '.github/scripts/state_finalize.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply state finalization
        run: python3 .github/scripts/state_finalize.py
      - name: Build and lint patched app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Commit completed changes and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/state-finalization.yml .github/scripts/state_finalize.py
          git add app/build.gradle.kts app/src/main/java/com/example/nfcdoorcard/ConfigProvider.kt app/src/main/java/com/example/nfcdoorcard/MainActivity.kt app/src/main/java/com/example/nfcdoorcard/xposed/NfcInjectionModule.java
          git commit -m "Finalize restart handoff and diagnostic snapshots"
          git push origin HEAD:main

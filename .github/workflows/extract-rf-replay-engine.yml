name: Extract RF Replay Engine

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/extract_rf_replay_engine.py'
      - '.github/workflows/extract-rf-replay-engine.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract replay engine
        run: python3 tools/extract_rf_replay_engine.py
      - name: Verify replay extraction
        run: |
          grep -q 'RfReplayEngine replayEngine' app/src/main/java/com/yagay/nfcdoorcard/xposed/NfcInjectionModule.java
          ! grep -q 'class RfInvocationSnapshot' app/src/main/java/com/yagay/nfcdoorcard/xposed/NfcInjectionModule.java
          grep -q 'versionName = "1.0.54"' app/build.gradle.kts
          grep -q 'HOOK_BUILD", "39"' app/build.gradle.kts
      - name: Build and test
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Remove one-shot files
        run: rm -f tools/extract_rf_replay_engine.py .github/workflows/extract-rf-replay-engine.yml
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: extract RF replay engine'
          git push origin HEAD:main

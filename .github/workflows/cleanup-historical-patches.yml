name: Cleanup Historical NFC Patches

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/cleanup_historical_patches.py'
      - '.github/workflows/cleanup-historical-patches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply cleanup
        run: python3 tools/cleanup_historical_patches.py
      - name: Remove retired settling source and test
        run: |
          rm -f app/src/main/java/com/yagay/nfcdoorcard/xposed/RfSettlingPolicy.java
          rm -f app/src/test/java/com/yagay/nfcdoorcard/xposed/RfSettlingPolicyTest.java
      - name: Verify retired symbols are gone
        run: |
          ! grep -R -n -E 'RfSettlingPolicy|finalReapplyArmed|finalReapplyBaselineSequence|finalVerifiedSequence|waitForRfSettled|recordLifecycleProvisional|persistRfSequenceState|isFinalReapplyWrite|rfWriteSequence|lastRfWriteAt' app/src/main app/src/test
          ! grep -R -n 'reinitializeController' app/src/main app/src/test
      - name: Build and test cleaned source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Remove one-shot migration files
        run: |
          rm -f tools/cleanup_historical_patches.py
          rm -f .github/workflows/cleanup-historical-patches.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove obsolete NFC recovery patches'
          git push origin HEAD:main

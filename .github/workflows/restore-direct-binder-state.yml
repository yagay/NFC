name: Restore direct Binder NFC state
on:
  push:
    paths:
      - '.github/workflows/restore-direct-binder-state.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source state
        run: |
          git checkout 841c7cb763f95b4c0785286feb773885e5c75123 -- \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/example/nfcdoorcard/LauncherActivity.kt \
            app/src/main/java/com/example/nfcdoorcard/MainActivity.kt \
            app/src/main/resources/META-INF/xposed/java_init.list \
            app/src/main/resources/META-INF/xposed/scope.list
          git rm -f app/src/main/java/com/example/nfcdoorcard/xposed/HeyTapShareModeBridgeModule.java || true
      - name: Commit restore
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'restore: NFC-only hook with direct Binder legacy UI'
          git push

name: Controller epoch monotonic hardening

on: [push]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply hardening
        run: python3 scripts/harden_controller_epoch_monotonic.py
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/nfcdoorcard/ConfigProvider.kt app/src/main/java/com/yagay/nfcdoorcard/xposed/NfcInjectionModule.java
          git commit -m "fix: make controller epoch monotonic" || exit 0
          git push

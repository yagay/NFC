name: Refine early RF replay

on: [push]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply refinement
        run: python3 scripts/refine_early_rf_replay.py
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/nfcdoorcard/xposed/NfcInjectionModule.java
          git commit -m "refactor: make early RF replay one-shot and isolated" || exit 0
          git push

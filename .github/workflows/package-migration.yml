name: Package migration

on: [push]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Migrate namespace
        run: |
          set -euo pipefail
          old='com.example.nfcdoorcard'
          git grep -Il -z "$old" | xargs -0 -r sed -i 's/com\.example\.nfcdoorcard/com.yagay.nfcdoorcard/g'

          if [ -d app/src/main/java/com/example/nfcdoorcard ]; then
            mkdir -p app/src/main/java/com/yagay
            git mv app/src/main/java/com/example/nfcdoorcard app/src/main/java/com/yagay/nfcdoorcard
          fi
          if [ -d app/src/test/java/com/example/nfcdoorcard ]; then
            mkdir -p app/src/test/java/com/yagay
            git mv app/src/test/java/com/example/nfcdoorcard app/src/test/java/com/yagay/nfcdoorcard
          fi

          sed -i 's/versionCode = 38/versionCode = 39/' app/build.gradle.kts
          sed -i 's/versionName = "1.0.37"/versionName = "1.0.38"/' app/build.gradle.kts
          sed -i 's/buildConfigField("int", "HOOK_BUILD", "26")/buildConfigField("int", "HOOK_BUILD", "27")/' app/build.gradle.kts
          sed -i 's#// Runtime protocol v6;.*#// Runtime protocol v6; complete com.yagay.nfcdoorcard namespace migration; hook build 27.#' app/build.gradle.kts
          sed -i 's#// The Android applicationId is.*#// Application ID, source namespace, Provider authority and LSPosed entry all use com.yagay.nfcdoorcard.#' app/build.gradle.kts

          rm -f .github/workflows/package-migration.yml

          if git grep -nF 'com.example.nfcdoorcard'; then
            echo 'legacy dotted package remains' >&2
            exit 1
          fi
          if find app/src -path '*com/example/nfcdoorcard*' -print -quit | grep -q .; then
            echo 'legacy package path remains' >&2
            exit 1
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: migrate all package identities to com.yagay.nfcdoorcard'
          git push origin HEAD:main

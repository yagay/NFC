name: Build and Verify APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify package namespace migration
        run: |
          set -euo pipefail
          LEGACY='com.example.'"nfcdoorcard"
          LEGACY_PATH='com/example/'"nfcdoorcard"
          if git grep -nF "$LEGACY"; then
            echo "Legacy package identity remains in tracked files" >&2
            exit 1
          fi
          if find app/src -path "*$LEGACY_PATH*" -print -quit | grep -q .; then
            echo "Legacy package directory remains" >&2
            exit 1
          fi
          test -d app/src/main/java/com/yagay/nfcdoorcard
          test -d app/src/test/java/com/yagay/nfcdoorcard

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, build and lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:lintDebug \
            :app:assembleRelease \
            --stacktrace

      - name: Verify APK files and Xposed metadata
        run: |
          set -euo pipefail
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          EXPECTED_VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' app/build.gradle.kts)
          EXPECTED_VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"$/\1/p' app/build.gradle.kts)
          test -n "$EXPECTED_VERSION_CODE"
          test -n "$EXPECTED_VERSION_NAME"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          for apk in "$DEBUG_APK" "$RELEASE_APK"; do
            CONTENTS=$(unzip -Z1 "$apk")
            grep -Fxq 'META-INF/xposed/java_init.list' <<< "$CONTENTS"
            grep -Fxq 'META-INF/xposed/module.prop' <<< "$CONTENTS"
            grep -Fxq 'META-INF/xposed/scope.list' <<< "$CONTENTS"
            test "$(unzip -p "$apk" META-INF/xposed/java_init.list)" = 'com.yagay.nfcdoorcard.xposed.NfcInjectionModule'
            test "$(unzip -p "$apk" META-INF/xposed/scope.list)" = 'com.android.nfc'
            BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk")
            grep -Fq "package: name='com.yagay.nfcdoorcard'" <<< "$BADGING"
            grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$BADGING"
            grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$BADGING"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-door-card-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-door-card-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply pending generation fix
        if: hashFiles('tools/apply_generation_fix.py') != ''
        run: python3 tools/apply_generation_fix.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and lint debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug --stacktrace

      - name: Verify debug APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-door-card-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit validated fix and restore workflow
        if: github.event_name == 'push' && hashFiles('tools/apply_generation_fix.py') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD^ -- .github/workflows/build-apk.yml
          git rm -f tools/apply_generation_fix.py .github/workflows/generation-ownership-fix.yml || true
          git add app/src/main/java/com/example/nfcdoorcard/xposed/NfcInjectionModule.java app/src/main/java/com/example/nfcdoorcard/MainActivity.kt app/build.gradle.kts .github/workflows/build-apk.yml
          git commit -m 'Fix generation isolation and controller stop recovery'
          git push origin HEAD:main

name: Build and Verify APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, build and lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:lintDebug \
            :app:assembleRelease \
            --stacktrace

      - name: Verify APK files and Xposed metadata
        run: |
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          for apk in "$DEBUG_APK" "$RELEASE_APK"; do
            unzip -l "$apk" | grep -q 'META-INF/xposed/java_init.list'
            unzip -l "$apk" | grep -q 'META-INF/xposed/module.prop'
            unzip -p "$apk" META-INF/xposed/java_init.list | grep -q 'com.example.nfcdoorcard.xposed.NfcInjectionModule'
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" | grep -q "package: name='com.yagay.nfcdoorcard'"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-door-card-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-door-card-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

name: Generalize Hook Runtime

on:
  push:
    paths:
      - '.github/workflows/generalize-hook.yml'

permissions:
  contents: write

jobs:
  generalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply generalization patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/generalize_hook.py')
          s = p.read_text()
          s = s.replace("replace('app/build.gradle.kts', 'versionCode = 29', 'versionCode = 30', 1)",
                        "replace('app/build.gradle.kts', 'versionCode = 30', 'versionCode = 31', 1)")
          start_marker = '# Generalize the RF hook hot path'
          end_marker = '# Discovery signature regression tests.'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          clean = r'''# Generalize the RF hook hot path while preserving all non-payload arguments.
          mod = root / 'app/src/main/java/com/example/nfcdoorcard/xposed/NfcInjectionModule.java'
          s = mod.read_text()
          old_args = """            Object[] args = chain.getArgs().toArray();
                      if (args.length != 1 || !(args[0] instanceof byte[])) return chain.proceed();
                      byte[] original = (byte[]) args[0];"""
          new_args = """            Object[] args = chain.getArgs().toArray();
                      int payloadArg = findSingleByteArrayArg(args);
                      if (payloadArg < 0) return chain.proceed();
                      byte[] original = (byte[]) args[payloadArg];"""
          if s.count(old_args) != 1: raise SystemExit('RF arg pattern mismatch')
          s = s.replace(old_args, new_args)

          old_stock = '                        Object result = chain.proceed(new Object[]{stock.clone()});'
          new_stock = """                        Object[] stockArgs = args.clone();
                                  stockArgs[payloadArg] = stock.clone();
                                  Object result = chain.proceed(stockArgs);"""
          if s.count(old_stock) != 1: raise SystemExit('stock proceed pattern mismatch')
          s = s.replace(old_stock, new_stock)

          old_rewrite = '            Object result = chain.proceed(new Object[]{rewritten.data});'
          new_rewrite = """            Object[] rewrittenArgs = args.clone();
                      rewrittenArgs[payloadArg] = rewritten.data;
                      Object result = chain.proceed(rewrittenArgs);"""
          if s.count(old_rewrite) != 1: raise SystemExit('rewrite proceed pattern mismatch')
          s = s.replace(old_rewrite, new_rewrite)

          anchor = '    private static NativeOutcome interpretNativeResult(Method method, Object result) {'
          helper = """    private static int findSingleByteArrayArg(Object[] args) {
                  if (args == null || args.length == 0) return -1;
                  int index = -1;
                  for (int i = 0; i < args.length; i++) {
                      if (args[i] instanceof byte[]) {
                          if (index >= 0) return -1;
                          index = i;
                      }
                  }
                  return index;
              }

          """
          if s.count(anchor) != 1: raise SystemExit('native outcome anchor mismatch')
          s = s.replace(anchor, helper + anchor)
          mod.write_text(s)

          '''
          p.write_text(s[:start] + clean + s[end:])
          PY
          python3 .github/scripts/generalize_hook.py
      - name: Verify tests and APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleRelease --stacktrace
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'META-INF/xposed/java_init.list'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'META-INF/xposed/java_init.list'
          grep -q 'NfcInjectionModule' <(unzip -p app/build/outputs/apk/debug/app-debug.apk META-INF/xposed/java_init.list)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Commit verified changes
        run: |
          git config user.name 'Jie'
          git config user.email '1614094+yagay@users.noreply.github.com'
          git rm -f .github/workflows/generalize-hook.yml .github/scripts/generalize_hook.py
          git add -A
          git commit -m 'Generalize hook discovery and Binder capabilities'
          git push origin HEAD:main

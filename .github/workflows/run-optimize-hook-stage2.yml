name: One-shot hook optimization stage 2
on:
  push:
    paths:
      - '.github/workflows/run-optimize-hook-stage2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hook optimization
        run: python3 scripts/optimize_hook_stage2.py
      - name: Commit optimization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/nfcdoorcard/MainActivity.kt app/src/main/java/com/example/nfcdoorcard/xposed/NfcInjectionModule.java
          git commit -m 'perf: make hook diagnostics opt-in and remove dead probes'
          git push

name: One-shot NFC config diagnostic patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-nfc-config-snapshot.yml'
      - '.github/scripts/add_nfc_config_snapshot.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply diagnostic patch
        run: python3 .github/scripts/add_nfc_config_snapshot.py
      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleRelease --stacktrace
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-nfc-config-snapshot.yml .github/scripts/add_nfc_config_snapshot.py
          git add app/src/main/java/com/example/nfcdoorcard/MainActivity.kt
          git commit -m "Include NFC config files in diagnostics"
          git push origin HEAD:main

name: Controller lifecycle v1.0.48 migration

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/migrate_controller_lifecycle_v1048.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply controller lifecycle migration
        run: python3 scripts/migrate_controller_lifecycle_v1048.py
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: recover UID on controller reinitialization"
          git push

name: Refactor Typed Provider API

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/refactor_typed_provider.py'
      - '.github/workflows/refactor-typed-provider.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply typed provider refactor
        run: python3 tools/refactor_typed_provider.py
      - name: Verify typed provider API
        run: |
          grep -q 'METHOD_PUBLISH_COMMAND' app/src/main/java/com/yagay/nfcdoorcard/ConfigProvider.kt
          grep -q 'override fun call' app/src/main/java/com/yagay/nfcdoorcard/ConfigProvider.kt
          grep -q 'ConfigClient' app/src/main/java/com/yagay/nfcdoorcard/MainActivity.kt
          ! grep -q 'private fun publishCommand(enabled: Boolean, card: CardModel?): Long {' app/src/main/java/com/yagay/nfcdoorcard/MainActivity.kt
          grep -q 'versionName = "1.0.53"' app/build.gradle.kts
      - name: Build and test
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Remove one-shot files
        run: rm -f tools/refactor_typed_provider.py .github/workflows/refactor-typed-provider.yml
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: add typed config provider API'
          git push origin HEAD:main

name: One-shot Production NFC Cleanup

on:
  push:
    paths:
      - '.github/workflows/hotfix-production-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable legacy runtime probes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/nfcdoorcard/xposed/NfcInjectionModule.java')
          s = p.read_text()
          old = '        installRefreshProbes(cl, pid);\n\n'
          if old not in s:
              raise SystemExit('installRefreshProbes call not found')
          s = s.replace(old, '        // Production path: keep only the UID injection hook. Diagnostic refresh probes are disabled.\n\n', 1)
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/nfcdoorcard/xposed/NfcInjectionModule.java
          git commit -m 'refactor: disable legacy NFC runtime probes'
          git push

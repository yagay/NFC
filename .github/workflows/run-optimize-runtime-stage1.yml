name: One-shot runtime optimization stage 1
on:
  push:
    paths:
      - '.github/workflows/run-optimize-runtime-stage1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply optimization patch
        run: python3 scripts/optimize_runtime_stage1.py
      - name: Commit optimization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/nfcdoorcard/MainActivity.kt app/src/main/java/com/example/nfcdoorcard/AppLogger.kt
          git commit -m 'perf: avoid root polling and separate NFC operations from logs'
          git push

name: One-shot Main Thread Hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-main-thread.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove synchronous root status read from first Compose frame
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/nfcdoorcard/MainActivity.kt')
          s = p.read_text()
          old = 'var status by remember { mutableStateOf(readRuntimeStatus()) }'
          new = 'var status by remember { mutableStateOf(RuntimeStatus()) }'
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/nfcdoorcard/MainActivity.kt
          git commit -m 'fix: keep root status reads off UI thread'
          git push

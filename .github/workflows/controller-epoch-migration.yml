name: Controller epoch migration

on: [push]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 scripts/controller_epoch_migration.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/nfcdoorcard/ConfigProvider.kt app/src/main/java/com/yagay/nfcdoorcard/RuntimeStatusRepository.kt app/src/main/java/com/yagay/nfcdoorcard/xposed/NfcInjectionModule.java app/build.gradle.kts
          git commit -m "fix: verify RF state by NFC controller epoch" || exit 0
          git push

name: Generation Ownership Fix

on:
  push:
    paths:
      - 'tools/apply_generation_fix.py'
      - '.github/workflows/generation-ownership-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply generation fix
        run: python3 tools/apply_generation_fix.py
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/nfcdoorcard/xposed/NfcInjectionModule.java app/src/main/java/com/example/nfcdoorcard/MainActivity.kt app/build.gradle.kts
          git commit -m 'Fix stale generation writes and controller stop recovery'
          git rm tools/apply_generation_fix.py .github/workflows/generation-ownership-fix.yml
          git commit -m 'Remove temporary generation fix helpers'
          git push origin HEAD:main

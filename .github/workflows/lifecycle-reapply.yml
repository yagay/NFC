name: One-shot NFC lifecycle reapply

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/lifecycle-reapply.yml'
      - '.github/scripts/lifecycle_reapply.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply lifecycle reapply patch
        run: python3 .github/scripts/lifecycle_reapply.py
      - name: Build and lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/lifecycle-reapply.yml .github/scripts/lifecycle_reapply.py
          git add app/build.gradle.kts app/src/main/java/com/example/nfcdoorcard/xposed/NfcInjectionModule.java
          git commit -m "Reapply simulated UID after NFC adapter restart"
          git push origin HEAD:main

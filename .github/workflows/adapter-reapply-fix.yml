name: Adapter reapply fix

on: [push]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply adapter reapply fix
        run: python3 scripts/fix_adapter_reapply.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/nfcdoorcard/xposed/NfcInjectionModule.java app/build.gradle.kts
          git commit -m "fix: reapply UID after NFC adapter reset" || exit 0
          git push

name: Refactor App Architecture

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/refactor_app_architecture.py'
      - '.github/workflows/refactor-app-architecture.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply app refactor
        run: python3 tools/refactor_app_architecture.py
      - name: Verify app architecture
        run: |
          test -f app/src/main/java/com/yagay/nfcdoorcard/nfc/NfcReaderController.kt
          test ! -f app/src/main/java/com/yagay/nfcdoorcard/nfc/NfcForegroundDispatcher.kt
          grep -q 'NfcReaderController' app/src/main/java/com/yagay/nfcdoorcard/MainActivity.kt
          grep -q 'CardRepository' app/src/main/java/com/yagay/nfcdoorcard/MainActivity.kt
          ! grep -q 'runtimeViewModel.update' app/src/main/java/com/yagay/nfcdoorcard/MainActivity.kt
          grep -q 'versionName = "1.0.52"' app/build.gradle.kts
      - name: Build and test
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Remove one-shot files
        run: rm -f tools/refactor_app_architecture.py .github/workflows/refactor-app-architecture.yml
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: modernize app-side NFC architecture'
          git push origin HEAD:main

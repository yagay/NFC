name: Refactor Recovery Architecture

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/refactor_recovery_architecture.py'
      - '.github/workflows/refactor-recovery-architecture.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply architecture refactor
        run: python3 tools/refactor_recovery_architecture.py
      - name: Verify architecture symbols
        run: |
          grep -q 'RecoveryStateMachine.next' app/src/main/java/com/yagay/nfcdoorcard/xposed/NfcInjectionModule.java
          grep -q 'ensureFullTriggerDiscovery' app/src/main/java/com/yagay/nfcdoorcard/xposed/NfcInjectionModule.java
          grep -q 'versionName = "1.0.51"' app/build.gradle.kts
      - name: Build and test
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Remove one-shot files
        run: rm -f tools/refactor_recovery_architecture.py .github/workflows/refactor-recovery-architecture.yml
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: simplify NFC recovery architecture'
          git push origin HEAD:main

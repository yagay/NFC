name: One-shot legacy UI background hook patch

on:
  push:
    paths:
      - '.github/workflows/run-main-heytap-background-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity
        run: python3 scripts/patch_main_heytap_background.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/nfcdoorcard/MainActivity.kt
          git commit -m 'refactor: keep legacy UI with HeyTap background hook'
          git push

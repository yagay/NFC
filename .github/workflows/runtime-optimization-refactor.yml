name: Runtime Optimization Refactor

on:
  push:
    paths:
      - '.github/workflows/runtime-optimization-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source refactor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'patch target not found: {label}')
              return text.replace(old, new, 1)

          # --- MainActivity: observer-based state refresh + bounded log state ---
          p = Path('app/src/main/java/com/example/nfcdoorcard/MainActivity.kt')
          s = p.read_text()
          s = replace_once(s,
              'import android.content.Intent\nimport android.nfc.NfcAdapter\n',
              'import android.content.Intent\nimport android.database.ContentObserver\nimport android.nfc.NfcAdapter\n',
              'MainActivity ContentObserver import')
          s = replace_once(s,
              'import android.os.Bundle\nimport android.os.Environment\n',
              'import android.os.Bundle\nimport android.os.Environment\nimport android.os.Handler\nimport android.os.Looper\n',
              'MainActivity Handler imports')

          old = '''        var status by remember { mutableStateOf(RuntimeStatus()) }\n        var logText by remember { mutableStateOf("") }\n        var selectedSource by remember { mutableStateOf(LogSource.STATUS) }\n        var diagnosticRunning by remember { mutableStateOf(false) }\n        var logsEnabled by remember { mutableStateOf(false) }\n        var expandedUid by remember { mutableStateOf<String?>(null) }\n        var operationMessage by remember { mutableStateOf<String?>(null) }\n        val logListState = rememberLazyListState()\n\n        LaunchedEffect(selectedSource, logsEnabled) {\n            while (true) {\n                val snapshot = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {\n                    val newStatus = readRuntimeStatus(includeRootPid = true)\n                    val logs = if (logsEnabled) fetchLogsSync(selectedSource) else ""\n                    newStatus to logs\n                }\n                status = snapshot.first\n                logText = if (logsEnabled) {\n                    if (selectedSource == LogSource.STATUS) buildStatusSummary(snapshot.first) + "\\n\\n" + snapshot.second else snapshot.second\n                } else ""\n                kotlinx.coroutines.delay(if (logsEnabled) 2000 else 4000)\n            }\n        }\n'''
          new = '''        var status by remember { mutableStateOf(RuntimeStatus()) }\n        val logLines = remember { mutableStateListOf<String>() }\n        var selectedSource by remember { mutableStateOf(LogSource.STATUS) }\n        var diagnosticRunning by remember { mutableStateOf(false) }\n        var logsEnabled by remember { mutableStateOf(false) }\n        var expandedUid by remember { mutableStateOf<String?>(null) }\n        var operationMessage by remember { mutableStateOf<String?>(null) }\n        var providerRevision by remember { mutableLongStateOf(0L) }\n        val logListState = rememberLazyListState()\n\n        DisposableEffect(Unit) {\n            val observer = object : ContentObserver(Handler(Looper.getMainLooper())) {\n                override fun onChange(selfChange: Boolean) { providerRevision++ }\n                override fun onChange(selfChange: Boolean, uri: android.net.Uri?) { providerRevision++ }\n            }\n            contentResolver.registerContentObserver(ConfigProvider.URI, true, observer)\n            providerRevision++\n            onDispose { runCatching { contentResolver.unregisterContentObserver(observer) } }\n        }\n\n        // Provider changes are the primary state clock: fast, event-driven and root-free.\n        LaunchedEffect(providerRevision) {\n            status = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {\n                readRuntimeStatus(includeRootPid = false)\n            }\n        }\n\n        // External watchdog catches an NFC process replacement that happens before the new\n        // process has had a chance to publish fresh provider state. Keep this deliberately low-rate.\n        LaunchedEffect(Unit) {\n            while (true) {\n                status = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {\n                    readRuntimeStatus(includeRootPid = true)\n                }\n                kotlinx.coroutines.delay(20_000)\n            }\n        }\n\n        // Logs are independent from runtime state. Only poll them while the log panel is open.\n        LaunchedEffect(selectedSource, logsEnabled) {\n            logLines.clear()\n            if (!logsEnabled) return@LaunchedEffect\n            while (true) {\n                val snapshot = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {\n                    val newStatus = readRuntimeStatus(includeRootPid = false)\n                    val raw = fetchLogsSync(selectedSource)\n                    val text = if (selectedSource == LogSource.STATUS) buildStatusSummary(newStatus) + "\\n\\n" + raw else raw\n                    newStatus to boundedLogLines(text)\n                }\n                status = snapshot.first\n                updateLogWindow(logLines, snapshot.second)\n                kotlinx.coroutines.delay(2000)\n            }\n        }\n'''
          s = replace_once(s, old, new, 'MainActivity polling loop')

          s = s.replace('if (!enabled) logText = ""', 'if (!enabled) logLines.clear()')
          s = s.replace('OutlinedButton(onClick = { AppLogger.clear(); logText = "" }, modifier = Modifier.weight(1f))',
                        'OutlinedButton(onClick = { AppLogger.clear(); logLines.clear() }, modifier = Modifier.weight(1f))')

          old = '''                            val lines = logText.split("\\n")\n                            LazyColumn(state = logListState, modifier = Modifier.fillMaxSize()) {\n                                items(lines) { line ->\n                                    Text(\n                                        line,\n                                        color = when {\n                                            line.contains("SUCCESS") || line.contains("APPLIED") || line.contains("ACCEPTED") || line.contains("READY") -> Color.Cyan\n                                            line.contains("FAILED") || line.contains("ERROR") || line.contains("STALE") || line.contains("FATAL") -> Color.Red\n                                            line.contains("WAITING") || line.contains("IDLE") || line.contains("RUNNING") || line.contains("TRIGGERED") -> Color.Yellow\n                                            line.contains("RF") || line.contains("NFCID1") || line.contains("NfcUIDSim") || line.contains("COMMAND") -> Color.Green\n                                            else -> Color(0xFFD4D4D4)\n                                        },\n                                        fontSize = 9.sp, lineHeight = 11.sp, fontFamily = FontFamily.Monospace\n                                    )\n                                }\n                            }\n                            LaunchedEffect(selectedSource, lines.size) {\n                                if (lines.isNotEmpty()) logListState.scrollToItem((lines.size - 1).coerceAtLeast(0))\n                            }\n'''
          new = '''                            LazyColumn(state = logListState, modifier = Modifier.fillMaxSize()) {\n                                items(logLines.size) { index ->\n                                    val line = logLines[index]\n                                    Text(\n                                        line,\n                                        color = when {\n                                            line.contains("SUCCESS") || line.contains("APPLIED") || line.contains("ACCEPTED") || line.contains("READY") -> Color.Cyan\n                                            line.contains("FAILED") || line.contains("ERROR") || line.contains("STALE") || line.contains("FATAL") -> Color.Red\n                                            line.contains("WAITING") || line.contains("IDLE") || line.contains("RUNNING") || line.contains("TRIGGERED") -> Color.Yellow\n                                            line.contains("RF") || line.contains("NFCID1") || line.contains("NfcUIDSim") || line.contains("COMMAND") -> Color.Green\n                                            else -> Color(0xFFD4D4D4)\n                                        },\n                                        fontSize = 9.sp, lineHeight = 11.sp, fontFamily = FontFamily.Monospace\n                                    )\n                                }\n                            }\n                            LaunchedEffect(selectedSource, logLines.size) {\n                                if (logLines.isNotEmpty()) logListState.scrollToItem((logLines.size - 1).coerceAtLeast(0))\n                            }\n'''
          s = replace_once(s, old, new, 'MainActivity log rendering')

          anchor = '''    private fun currentNfcPid(): String = runRootCmd("pidof com.android.nfc 2>/dev/null | awk '{print ${'$'}1}'", 5, 4096)\n        .lineSequence().firstOrNull { it.trim().matches(Regex("\\\\d+")) }?.trim().orEmpty()\n\n'''
          helpers = '''    private fun currentNfcPid(): String = runRootCmd("pidof com.android.nfc 2>/dev/null | awk '{print ${'$'}1}'", 5, 4096)\n        .lineSequence().firstOrNull { it.trim().matches(Regex("\\\\d+")) }?.trim().orEmpty()\n\n    private fun boundedLogLines(text: String, maxLines: Int = 1800): List<String> {\n        if (text.isEmpty()) return emptyList()\n        val lines = text.lineSequence().toList()\n        return if (lines.size <= maxLines) lines else lines.takeLast(maxLines)\n    }\n\n    /**\n     * Applies the smallest prefix/suffix diff possible to the Compose state list instead of\n     * replacing/splitting the entire log inside composition every refresh. The window is bounded\n     * by boundedLogLines(), so memory and recomposition cost stay predictable.\n     */\n    private fun updateLogWindow(target: MutableList<String>, incoming: List<String>) {\n        var prefix = 0\n        val commonLimit = minOf(target.size, incoming.size)\n        while (prefix < commonLimit && target[prefix] == incoming[prefix]) prefix++\n\n        var suffix = 0\n        while (suffix < commonLimit - prefix &&\n            target[target.size - 1 - suffix] == incoming[incoming.size - 1 - suffix]) {\n            suffix++\n        }\n\n        val removeUntil = target.size - suffix\n        for (i in removeUntil - 1 downTo prefix) target.removeAt(i)\n        val addUntil = incoming.size - suffix\n        if (prefix < addUntil) target.addAll(prefix, incoming.subList(prefix, addUntil))\n    }\n\n'''
          s = replace_once(s, anchor, helpers, 'MainActivity log helpers')
          p.write_text(s)

          # --- NfcInjectionModule: verified profile fast path must skip diagnostic DEX trigger scan ---
          p = Path('app/src/main/java/com/example/nfcdoorcard/xposed/NfcInjectionModule.java')
          s = p.read_text()
          s = replace_once(s,
              '''        persistTriggerCandidates(pid, discoveryEngine.discoverTriggerCandidates(cl));\n        List<HookTarget> installTargets = new ArrayList<>();\n        HookTarget cached = profileStore.loadValid(app, cl);\n''',
              '''        List<HookTarget> installTargets = new ArrayList<>();\n        HookTarget cached = profileStore.loadValid(app, cl);\n''',
              'skip trigger scan before cache')
          s = replace_once(s,
              '''        } else {\n            learningMode = true;\n            reportStatusWithRetry(pid, false, 0, "DISCOVERING", "Profile invalid/missing; learning deepest RF_CONFIG_WRITE", null);\n''',
              '''        } else {\n            learningMode = true;\n            // Trigger candidate discovery is diagnostic-only. Avoid the expensive DEX walk on\n            // the verified-profile fast path; only refresh it when RF profile discovery is needed.\n            persistTriggerCandidates(pid, discoveryEngine.discoverTriggerCandidates(cl));\n            reportStatusWithRetry(pid, false, 0, "DISCOVERING", "Profile invalid/missing; learning deepest RF_CONFIG_WRITE", null);\n''',
              'trigger scan on learning path')
          p.write_text(s)

          # --- Controller: classify transient reinit failures; avoid pointless long waits ---
          p = Path('app/src/main/java/com/example/nfcdoorcard/xposed/NfcProcessVendorController.java')
          s = p.read_text()
          s = replace_once(s,
              '''    Result reinitializeController() {\n        try {\n''',
              '''    Result reinitializeController() {\n        Result last = null;\n        for (int attempt = 0; attempt < 3; attempt++) {\n            last = reinitializeControllerOnce();\n            if (last.success || !isControllerTransient(last.stage)) return last;\n            if (attempt < 2) sleep(120L);\n        }\n        return last == null\n                ? new Result(false, "CONTROLLER_UNKNOWN", "No controller reinit result", null)\n                : new Result(false, last.stage, last.detail + " after transient retries", last.vendorDescriptor);\n    }\n\n    private Result reinitializeControllerOnce() {\n        try {\n''',
              'controller retry wrapper')
          s = replace_once(s,
              '''    private static boolean isTransient(String stage) {\n        return "MAIN_BINDER".equals(stage)\n                || "GET_VENDOR_BINDER".equals(stage)\n                || "EXCEPTION".equals(stage);\n    }\n''',
              '''    private static boolean isTransient(String stage) {\n        return "MAIN_BINDER".equals(stage)\n                || "GET_VENDOR_BINDER".equals(stage)\n                || "EXCEPTION".equals(stage);\n    }\n\n    private static boolean isControllerTransient(String stage) {\n        return "CONTROLLER_BINDER".equals(stage) || "CONTROLLER_EXCEPTION".equals(stage);\n    }\n''',
              'controller failure policy')
          p.write_text(s)

          # --- Version bump because Hook/Controller behavior changed ---
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = replace_once(s, 'versionCode = 24\n        versionName = "1.0.23"\n\n        buildConfigField("int", "HOOK_BUILD", "18")',
                           'versionCode = 25\n        versionName = "1.0.24"\n\n        buildConfigField("int", "HOOK_BUILD", "19")',
                           'version bump')
          p.write_text(s)

          # Self-remove this one-shot workflow from the resulting source commit.
          Path('.github/workflows/runtime-optimization-refactor.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Optimize runtime updates and cached hook startup'
          git push

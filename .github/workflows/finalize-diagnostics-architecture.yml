name: Finalize Diagnostics Architecture

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/finalize_diagnostics_architecture.py'
      - '.github/workflows/finalize-diagnostics-architecture.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply final architecture refactor
        run: python3 tools/finalize_diagnostics_architecture.py
      - name: Verify architecture
        run: |
          test -f app/src/main/java/com/yagay/nfcdoorcard/DiagnosticsCollector.kt
          grep -q 'DiagnosticsCollector' app/src/main/java/com/yagay/nfcdoorcard/MainActivity.kt
          grep -q 'diagnosticsCollector.fetchLogs' app/src/main/java/com/yagay/nfcdoorcard/MainActivity.kt
          grep -q 'diagnosticsCollector.buildFullReport' app/src/main/java/com/yagay/nfcdoorcard/MainActivity.kt
          ! grep -q 'private fun fetchLogsSync' app/src/main/java/com/yagay/nfcdoorcard/MainActivity.kt
          ! grep -q 'private fun collectNfcOverwriteTrace' app/src/main/java/com/yagay/nfcdoorcard/MainActivity.kt
          ! grep -q 'private lateinit var rootShell' app/src/main/java/com/yagay/nfcdoorcard/MainActivity.kt
          grep -q 'ROOT_FAILURE_CACHE_MS' app/src/main/java/com/yagay/nfcdoorcard/system/RootShell.kt
          grep -q 'versionName = "1.0.55"' app/build.gradle.kts
          grep -q 'HOOK_BUILD", "39"' app/build.gradle.kts
      - name: Build and test
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Remove one-shot files
        run: |
          rm -f tools/finalize_diagnostics_architecture.py
          rm -f .github/workflows/finalize-diagnostics-architecture.yml
      - name: Commit final architecture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'refactor: finalize NFC app architecture'
            git push origin HEAD:main
          fi
